# Inactive by default. Model download requires explicit approval; never auto-pull weights.
services:
  chat-ollama:
    image: ollama/ollama:0.40.4@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6
    profiles: [m13]
    ports: ["127.0.0.1:11436:11434"]
    mem_limit: ${CHAT_OLLAMA_MEMORY:-8g}
    memswap_limit: ${CHAT_OLLAMA_MEMORY:-8g}
    cpus: ${CHAT_OLLAMA_CPUS:-4}
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - m13_models:/root/.ollama
volumes:
  m13_models:
    external: true
    name: traceback_m13_models
