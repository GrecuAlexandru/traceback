# Persistent loopback-only demo, separate from disposable M17 tests.
# Start with scripts/demo/manage.py; do not combine with compose.yaml.
name: traceback-demo
x-java: &java
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=128m,uid=10001,gid=10001"]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  group_add: ["${DEMO_DOCKER_GID:-0}"]
  mem_limit: 1g
  cpus: 1
  pids_limit: 160
  stop_grace_period: 35s
  network_mode: service:loopback
  environment: &java-env
    TRACEBACK_ENVIRONMENT: local-production-like
    SPRING_PROFILES_ACTIVE: ""
    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/traceback_demo?connectTimeout=3&socketTimeout=35
    SPRING_DATASOURCE_USERNAME: traceback_demo_api
    SPRING_DATASOURCE_PASSWORD: ""
    SPRING_FLYWAY_ENABLED: "false"
    SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://127.0.0.1:18181/realms/traceback-demo
    SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 25s
    SPRING_TASK_SCHEDULING_SHUTDOWN_AWAIT_TERMINATION: "true"
    SPRING_TASK_SCHEDULING_SHUTDOWN_AWAIT_TERMINATION_PERIOD: 20s
    SERVER_SHUTDOWN: graceful
    LOCAL_AWS_ENABLED: "true"
    LOCAL_AWS_ENDPOINT: http://localstack:4566
    DOCUMENT_STORAGE_PROVIDER: LOCAL
    DOCUMENT_STORAGE_DIRECTORY: /var/lib/traceback/documents
    PDF_EXTRACTION_IMAGE: traceback-pdf:m17
    INDEXING_ENABLED: "true"
    EMBEDDING_ENDPOINT: http://ollama:11434
    EMBEDDING_MODEL_DIGEST: sha256:0a109f422b47e3a30ba2b10eca18548e944e8a23073ee3f3e947efcf3c45e59f
    CHAT_ENABLED: "true"
    CHAT_ENDPOINT: http://chat-ollama:11434
    CHAT_MODEL_DIGEST: sha256:845dbda0ea48ed749caafd9e6037047aa19acfcfd82e704d7ca97d631a0b697e
    MCP_ENABLED: "false"
services:
  loopback:
    restart: unless-stopped
    image: alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    command: [sleep, infinity]
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 16m
    cpus: 0.1
    pids_limit: 8
    ports: ["127.0.0.1:18766:8765", "127.0.0.1:18181:18181", "127.0.0.1:18081:8080"]
  frontend:
    restart: unless-stopped
    image: traceback-frontend:m17
    network_mode: service:loopback
    depends_on:
      loopback: {condition: service_started}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      TRACEBACK_ENVIRONMENT: local-production-like
      APP_ORIGIN: http://127.0.0.1:18766
      OIDC_ISSUER: http://127.0.0.1:18181/realms/traceback-demo
      OIDC_CLIENT_ID: traceback-demo-web
      BACKEND_ORIGIN: http://127.0.0.1:8080
      ALLOW_LOCAL_HTTP: "true"
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m,uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    pids_limit: 100
    stop_grace_period: 15s
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: traceback_demo
      POSTGRES_USER: traceback_demo
      POSTGRES_HOST_AUTH_METHOD: trust
    # Private demo database: survives container recreation. No published DB port.
    volumes: [database:/var/lib/postgresql/data]
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, pg_isready -U traceback_demo -d traceback_demo]
      interval: 3s
      timeout: 2s
      retries: 30
  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.8.0
    command: [start-dev, --http-port=18181, --import-realm, --health-enabled=true, --hostname=http://127.0.0.1:18181]
    network_mode: service:loopback
    depends_on:
      loopback: {condition: service_started}
    volumes:
      - identity:/opt/keycloak/data
      - ${DEMO_DIRECTORY:?Run scripts/demo/manage.py up first}/realm.json:/opt/keycloak/data/import/realm.json:ro
    mem_limit: 768m
    cpus: 1
    healthcheck:
      test: [CMD, bash, -ec, "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&3; IFS= read -r status <&3; [[ $$status == *'200 OK'* ]]"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
  localstack:
    restart: unless-stopped
    image: localstack/localstack:4.8.1
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      SQS_ENDPOINT_STRATEGY: path
    volumes:
      - ./scripts/localstack/10-init.sh:/etc/localstack/init/ready.d/10-init.sh:ro
    mem_limit: 512m
    cpus: 1
    healthcheck:
      test: [CMD-SHELL, awslocal sqs get-queue-url --queue-name traceback-ingestion-local >/dev/null]
      interval: 5s
      timeout: 5s
      retries: 30
  api:
    <<: *java
    image: traceback-api:m17
    build: {context: ., dockerfile: backend/Dockerfile, target: api}
    environment:
      <<: *java-env
      SERVER_ADDRESS: 0.0.0.0
      SERVER_PORT: "8080"
    volumes:
      - legacy:/var/lib/traceback/documents
      - ${DEMO_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      frontend: {condition: service_started}
      keycloak: {condition: service_healthy}
      postgres: {condition: service_healthy}
      localstack: {condition: service_healthy}
  worker:
    <<: *java
    image: traceback-worker:m17
    build: {context: ., dockerfile: backend/Dockerfile, target: worker}
    environment:
      <<: *java-env
      SPRING_DATASOURCE_USERNAME: traceback_demo_worker
      SPRING_PROFILES_ACTIVE: worker
      SERVER_ADDRESS: 127.0.0.1
      SERVER_PORT: "8081"
      SPRING_FLYWAY_ENABLED: "false"
    volumes:
      - legacy:/var/lib/traceback/documents:ro
      - ${DEMO_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      api: {condition: service_healthy}
  ollama:
    restart: unless-stopped
    image: ollama/ollama:0.40.4@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6
    environment: {OLLAMA_NO_CLOUD: "1", OLLAMA_NUM_PARALLEL: "1", OLLAMA_MAX_LOADED_MODELS: "1"}
    volumes: [m12_models:/root/.ollama:ro]
    tmpfs: [/tmp:size=64m]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
  chat-ollama:
    restart: unless-stopped
    image: ollama/ollama:0.40.4@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6
    environment: {OLLAMA_NO_CLOUD: "1", OLLAMA_NUM_PARALLEL: "1", OLLAMA_MAX_LOADED_MODELS: "1"}
    volumes: [m13_models:/root/.ollama:ro]
    tmpfs: [/tmp:size=64m]
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 4
volumes:
  legacy: {}
  database: {}
  identity: {}
  m12_models: {external: true, name: traceback_m12_models}
  m13_models: {external: true, name: traceback_m13_models}
