# Opt-in local embedding runtime. Pull the model explicitly after resource/download approval.
services:
  ollama:
    image: ollama/ollama:0.40.4@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6
    profiles: [m12]
    ports: ["127.0.0.1:11435:11434"]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - m12_models:/root/.ollama
volumes:
  m12_models:
    external: true
    name: traceback_m12_models
