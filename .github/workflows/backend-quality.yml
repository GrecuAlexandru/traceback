name: Backend quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Compile, migrations, unit, integration, security and deterministic evaluation
        run: ./backend/mvnw -f backend/pom.xml --batch-mode clean verify
      - name: Require actual tests without skips
        run: python3 scripts/quality/check_test_results.py
      - name: Local authentication helper regressions
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate all local Compose profiles
        env:
          KEYCLOAK_ADMIN_PASSWORD: ci-placeholder
        run: docker compose -f compose.yaml -f compose.m12.yaml -f compose.m13.yaml --profile m12 --profile m13 config --quiet
      - name: Diff whitespace
        run: git show --format= --check HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: synthetic-test-results
          path: |
            backend/target/surefire-reports/TEST-*.xml
            backend/target/m15/*.json
  scans:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Dependency metadata only, including test dependencies
        run: ./backend/mvnw -f backend/pom.xml --batch-mode org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json -DincludeTestScope=true
      - name: Install pinned public scanners
        run: python3 scripts/quality/install_scanners.py --directory "$RUNNER_TEMP/traceback-scanners"
      - name: Dependency and redacted current-source secret gates
        run: python3 scripts/quality/run_scans.py --binaries "$RUNNER_TEMP/traceback-scanners"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: scan-results
          path: backend/target/m15/scans/scan-summary.json
