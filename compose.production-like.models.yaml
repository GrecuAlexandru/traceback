# Optional installed model volumes only. Never downloads weights.
services:
  ollama:
    profiles: [models]
    image: ollama/ollama:0.40.4@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6
    environment: {OLLAMA_NO_CLOUD: "1", OLLAMA_NUM_PARALLEL: "1", OLLAMA_MAX_LOADED_MODELS: "1"}
    volumes: [m12_models:/root/.ollama:ro]
    tmpfs: [/tmp:size=64m]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 2
  chat-ollama:
    profiles: [models]
    image: ollama/ollama:0.40.4@sha256:926d40fd6eeeebd346b5c358a63de2a10ec995371cd93dd22f1843200694b1a6
    environment: {OLLAMA_NO_CLOUD: "1", OLLAMA_NUM_PARALLEL: "1", OLLAMA_MAX_LOADED_MODELS: "1"}
    volumes: [m13_models:/root/.ollama:ro]
    tmpfs: [/tmp:size=64m]
    mem_limit: 8g
    memswap_limit: 8g
    cpus: 4
volumes:
  m12_models: {external: true, name: traceback_m12_models}
  m13_models: {external: true, name: traceback_m13_models}
