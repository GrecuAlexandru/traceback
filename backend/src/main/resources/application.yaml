spring:
  application:
    name: traceback-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/traceback
    username: ${DB_USER:traceback}
    password: ${DB_PASSWORD:traceback_dev}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/traceback
          audiences:
            - traceback-api

