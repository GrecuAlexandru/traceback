
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: traceback
      POSTGRES_USER: traceback
      POSTGRES_PASSWORD: traceback_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U traceback -d traceback"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
